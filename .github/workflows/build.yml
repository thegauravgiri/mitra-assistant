name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            libx11-dev \
            libxkbcommon-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --- Platform builds ---

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      # --- Package artifacts ---

      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y mitra_assistant-macos.zip mitra_assistant.app

      - name: Package Windows
        if: matrix.platform == 'windows'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mitra_assistant-windows.zip

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: tar -czf mitra_assistant-linux.tar.gz -C build/linux/x64/release/bundle .

      # --- Upload ---

      - name: Upload macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: mitra_assistant-macos
          path: build/macos/Build/Products/Release/mitra_assistant-macos.zip
          if-no-files-found: error

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: mitra_assistant-windows
          path: mitra_assistant-windows.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mitra_assistant-linux
          path: mitra_assistant-linux.tar.gz
          if-no-files-found: error
